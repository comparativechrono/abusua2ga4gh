[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abusua2ga4gh"
version = "0.2.0"
description = "Convert Abusua Pedigree Studio session files to GA4GH Pedigree and Phenopackets."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    {name = "Tim Hearn", email = "tjh70@cam.ac.uk"},
]
keywords = ["pedigree", "phenopackets", "GA4GH", "genomics", "interoperability", "Akan"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []   # pure standard library; no runtime dependencies

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
abusua2ga4gh = "abusua2ga4gh.cli:main"

[project.urls]
Homepage = "https://github.com/comparativechrono/abusua2ga4gh"
Issues = "https://github.com/comparativechrono/abusua2ga4gh/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
